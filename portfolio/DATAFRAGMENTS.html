/* ===== 2x2 BIG GRID ===== */
.gallery{
display:grid;
grid-template-columns: repeat(2, 1fr);
gap:25px;
max-width:1100px;
margin:40px auto;
padding:20px;
}

/* TILE */
.item{
position:relative;
overflow:hidden;
border:1px solid #222;
background:#050505;
cursor:pointer;
height:360px;
}

/* ===== HIDDEN IMAGE (CORRUPTED FILE LOOK) ===== */
.item img{
width:100%;
height:100%;
object-fit:cover;
display:block;

/* HIDDEN STATE */
opacity:0;
filter: blur(10px) brightness(0.3) contrast(0.7);
transform: scale(1.05);

transition:0.4s ease;
}

/* REVEAL ON HOVER */
.item:hover img{
opacity:1;
filter: blur(0px) brightness(1) contrast(1.4) saturate(1.3);
transform: scale(1.08);
}

/* LIGHTBOX */
.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.97);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.lightbox img{
max-width:92%;
max-height:92%;
border:2px solid white;
box-shadow:0 0 40px rgba(255,255,255,0.25);
transform:scale(0.85);
opacity:0;
transition:0.2s ease-in-out;
}

.lightbox.show img{
transform:scale(1);
opacity:1;
}

<div class="lightbox" id="lightbox">
<img id="lightboxImg">
</div>

<script>

// RANDOMIZE ORDER EACH VISIT
const gallery = document.getElementById("gallery");
for (let i = gallery.children.length; i >= 0; i--) {
  gallery.appendChild(gallery.children[Math.random() * i | 0]);
}

// LIGHTBOX
const items = document.querySelectorAll('.item img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

items.forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;

    setTimeout(() => {
      lightbox.classList.add('show');
    }, 10);
  });
});

lightbox.addEventListener('click', () => {
  lightbox.classList.remove('show');

  setTimeout(() => {
    lightbox.style.display = 'none';
    lightboxImg.src = "";
  }, 200);
});

</script>
